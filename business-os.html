<title>Second Brain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg: #ffffff;
  --bg-soft: #f6f6f4;
  --surface: #ffffff;
  --surface-2: #f6f6f4;
  --ink: #17181a;
  --ink-2: #59595a;
  --ink-3: #97979a;
  --border: #e6e6e6;
  --border-soft: #eeeeee;
  --mint: #cdf5eb;
  --sky: #7cc8ff;
  --grad: linear-gradient(120deg, #cdf5eb 0%, #9fe0e0 45%, #7cc8ff 100%);
  --grad-text: linear-gradient(120deg, #3a9c88 0%, #3f86bd 100%);
  --grad-ink: #163a34;
  --grad-glow: rgba(124,200,255,.35);
  --good: #4f8d68;
  --good-bg: #e9f3ec;
  --warn: #b3812f;
  --warn-bg: #faf1de;
  --crit: #b25b52;
  --crit-bg: #f8e9e6;
  --shadow-sm: 0 1px 2px rgba(20,20,20,.05), 0 1px 1px rgba(20,20,20,.04);
  --shadow-md: 0 8px 24px -8px rgba(20,20,20,.12), 0 2px 6px -2px rgba(20,20,20,.05);
  --shadow-lg: 0 24px 60px -16px rgba(20,20,20,.20);
  --radius: 18px;
  --radius-sm: 12px;
  --font-display: 'DM Sans', system-ui, sans-serif;
  --font-body: 'Nunito Sans', system-ui, sans-serif;
}
/* This product commits to one visual world — white surfaces, near-black
   ink and the RemindFuel gradient as the only accent — so it stays
   single-theme by design rather than swapping in a dark palette. */

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;}
button{font-family:inherit;}
::selection{background:#7cc8ff55;}
.grad-text{
  background:var(--grad-text);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.eyebrow{
  font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
}
.scroll-thin::-webkit-scrollbar{width:6px;height:6px;}
.scroll-thin::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ============ SHELL ============ */
/* Ambient, transparent gradient wash behind the whole product — fixed so
   it stays put while content scrolls over it. */
body::before, body::after{
  content:""; position:fixed; border-radius:50%; filter:blur(95px); z-index:0; pointer-events:none;
}
body::before{ width:560px; height:560px; top:-200px; right:-160px;
  background:radial-gradient(circle, rgba(205,245,235,.38), transparent 70%); }
body::after{ width:480px; height:480px; bottom:-180px; left:120px;
  background:radial-gradient(circle, rgba(124,200,255,.28), transparent 70%); }
.app{display:flex; min-height:100vh; position:relative; z-index:1;}

/* ---- sidebar ---- */
.sidebar{
  width:220px; flex:none;
  padding:26px 16px 20px;
  display:flex; flex-direction:column; gap:28px;
  border-right:1px solid var(--border-soft);
  position:sticky; top:0; height:100vh;
  transition:width .25s ease, padding .25s ease;
}
.sidebar.collapsed{width:76px; padding-left:14px; padding-right:14px;}
.brand-mark{display:flex; align-items:center; gap:10px; padding:0 6px;}
.brand-dot{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:var(--grad);
  box-shadow:0 4px 14px -4px rgba(124,200,255,.55);
}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:15.5px; white-space:nowrap; overflow:hidden;}
.sidebar.collapsed .brand-name, .sidebar.collapsed .navlabel, .sidebar.collapsed .cap-name{display:none;}

.navgroup{display:flex; flex-direction:column; gap:2px;}
.navitem{
  display:flex; align-items:center; gap:12px;
  padding:9px 12px; border-radius:11px; cursor:pointer;
  color:var(--ink-2); font-weight:600; font-size:14px;
  transition:background .15s ease, color .15s ease;
  white-space:nowrap; overflow:hidden;
}
.navitem svg{flex:none; width:18px;height:18px; opacity:.85;}
.navitem:hover{background:var(--surface-2); color:var(--ink);}
.navitem.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.navitem.active svg{opacity:1;}
.navitem .dot-badge{
  margin-left:auto; width:7px;height:7px;border-radius:50%; background:var(--grad); flex:none;
}
.sidebar.collapsed .dot-badge{display:none;}
.sidebar.collapsed .navitem{justify-content:center; padding:10px;}

.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px;}
.cap-pill-row{display:flex; gap:5px; padding:4px; background:var(--surface-2); border-radius:11px;}
.cap-btn{
  flex:1; text-align:center; padding:6px 4px; border:none; background:transparent; border-radius:8px;
  font-size:11.5px; font-weight:700; color:var(--ink-3); cursor:pointer; transition:.15s;
}
.cap-btn.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.collapse-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--border-soft); background:var(--surface); border-radius:10px;
  padding:8px; cursor:pointer; color:var(--ink-3); font-size:12px; font-weight:600;
}
.collapse-btn:hover{color:var(--ink);}

/* ---- main ---- */
.main{flex:1; min-width:0; padding:30px 44px 90px; max-width:1180px;}
@media (max-width: 900px){ .main{padding:22px 18px 70px;} .sidebar{position:fixed; z-index:40; background:var(--bg);} }

.view{display:none; animation:viewIn .5s cubic-bezier(.2,.8,.2,1);}
.view.active{display:block;}
@keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

/* ============ SHARED COMPONENTS ============ */
.card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px;
  font-size:12px; font-weight:700; border:1px solid var(--border);
}
.pill.good{background:var(--good-bg); color:var(--good); border-color:transparent;}
.pill.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent;}
.pill.crit{background:var(--crit-bg); color:var(--crit); border-color:transparent;}
.pill.neutral{background:var(--surface-2); color:var(--ink-2); border-color:transparent;}
.pill.grad{background:var(--grad); color:var(--grad-ink); border-color:transparent;}

.btn{
  display:inline-flex; align-items:center; gap:8px; border-radius:11px; padding:10px 16px;
  font-weight:700; font-size:13.5px; cursor:pointer; border:1px solid var(--border); background:var(--surface);
  color:var(--ink); transition:.15s ease;
}
.btn:hover{border-color:var(--ink-3); transform:translateY(-1px);}
.btn.primary{background:var(--grad); color:var(--grad-ink); border-color:transparent; font-weight:800;}
.btn.primary:hover{filter:brightness(1.04);}
.btn.ghost{border-color:transparent; background:transparent; padding:8px 10px;}
.btn.ghost:hover{background:var(--surface-2); transform:none;}
.btn.sm{padding:7px 12px; font-size:12.5px; border-radius:9px;}

.glow-ring{position:relative; isolation:isolate;}
.glow-ring::before{
  content:""; position:absolute; inset:-1.5px; border-radius:inherit; padding:1.5px;
  background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:.9; z-index:-1;
}

/* ============ HOME ============ */
.home-hero{padding:6px 2px 30px;}
.home-hero h1{font-size:clamp(30px,3.6vw,44px); font-weight:700; letter-spacing:-.01em;}
.home-hero .sub{margin-top:8px; font-size:16.5px; color:var(--ink-2); max-width:46ch;}

.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:44px 0 16px;}
.section-head h2{font-size:19px; font-weight:700;}
.section-head .hint{font-size:12.5px; color:var(--ink-3);}

/* ---- Tagescheck summary strip (replaces inline capacity + focus pickers) ---- */
.daycheck-summary{
  display:flex; align-items:center; gap:22px; margin-top:24px; padding:16px 22px; border-radius:18px;
  background:
    radial-gradient(120% 160% at 0% 0%, rgba(205,245,235,.5), transparent 60%),
    radial-gradient(120% 160% at 100% 100%, rgba(124,200,255,.4), transparent 60%),
    var(--surface);
  border:1px solid var(--border-soft); flex-wrap:wrap;
}
.dcs-item{display:flex; flex-direction:column; gap:3px;}
.dcs-item.grow{flex:1; min-width:200px;}
.dcs-k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
.dcs-v{font-size:15px; font-weight:700; font-family:var(--font-display);}
.dcs-cap{display:inline-flex; align-items:center; gap:6px;}
.dcs-cap .cdot{width:8px;height:8px;border-radius:50%;}
.dcs-divider{width:1px; height:32px; background:var(--border);}

/* ---- Quick-glance tiles: was ansteht / wo du stehst / was offen ist / größtes Potential ---- */
.glance-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px;}
@media (max-width:900px){.glance-grid{grid-template-columns:1fr 1fr;}}
.glance-tile{
  border-radius:16px; padding:17px 18px; border:1px solid var(--border-soft); background:var(--surface);
  display:flex; flex-direction:column; gap:8px; min-height:104px; position:relative; overflow:hidden;
}
.glance-tile .gk{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:6px;}
.glance-tile .gk svg{width:13px; height:13px; flex:none;}
.week-tile .wt-k svg{width:13px; height:13px; flex:none;}
.glance-tile .gv{font-size:14.5px; font-weight:700; line-height:1.4;}
.glance-tile .gs{font-size:12px; color:var(--ink-2);}
.glance-tile.potential{
  background:
    radial-gradient(140% 160% at 100% 0%, rgba(205,245,235,.55), transparent 60%),
    radial-gradient(120% 140% at 0% 100%, rgba(124,200,255,.4), transparent 60%),
    var(--surface);
  border-color:transparent;
}
.glance-tile.potential .gk{color:var(--grad-ink);}

/* ---- Tagescheck modal ---- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,18,16,.32); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:80; padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  width:min(520px,100%); max-height:88vh; overflow-y:auto; background:var(--surface); border-radius:24px;
  padding:34px 32px; box-shadow:var(--shadow-lg); position:relative; animation:modalIn .35s cubic-bezier(.2,.8,.2,1);
  border:1px solid var(--border-soft);
}
.modal::before{
  content:""; position:absolute; left:-70px; top:-90px; width:260px; height:260px; border-radius:50%;
  background:var(--grad); filter:blur(60px); opacity:.35; z-index:0; pointer-events:none;
}
.modal > *{position:relative; z-index:1;}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
.modal h2{font-size:24px; margin-top:6px;}
.modal .sub{margin-top:6px; font-size:14px; color:var(--ink-2);}
.dc-block{margin-top:26px;}
.dc-label{font-size:12.5px; font-weight:700; color:var(--ink-2); margin-bottom:10px;}
.cap-select{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:12px;}
.cap-select.large{padding:5px;}
.cap-opt{flex:1; text-align:center; padding:10px 16px; border-radius:9px; font-size:13.5px; font-weight:700; color:var(--ink-3); cursor:pointer; border:none; background:transparent;}
.cap-opt.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.dc-focus-list{display:flex; flex-direction:column; gap:8px;}
.dc-focus-row{
  display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:14px; cursor:pointer;
  border:1px solid var(--border-soft); background:var(--surface); transition:.15s;
}
.dc-focus-row:hover{border-color:var(--ink-3);}
.dc-focus-row.selected{border-color:transparent; background:
    radial-gradient(160% 200% at 0% 0%, rgba(205,245,235,.55), transparent 65%),
    radial-gradient(140% 180% at 100% 100%, rgba(124,200,255,.4), transparent 65%),
    var(--surface); box-shadow:0 0 0 1.5px rgba(124,200,255,.5) inset;}
.dc-radio{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--border); flex:none; margin-top:2px; position:relative;}
.dc-focus-row.selected .dc-radio{border-color:var(--grad-ink);}
.dc-focus-row.selected .dc-radio::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--grad);}
.dc-focus-row .cat{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
.dc-focus-row .ti{font-size:14.5px; font-weight:700; margin-top:3px;}
.dc-focus-row .wy{font-size:12.5px; color:var(--ink-2); margin-top:3px; line-height:1.5;}
.dc-submit{width:100%; justify-content:center; margin-top:26px; padding:14px; font-size:14.5px;}

/* ---- "Diese Woche" — redesigned to be scannable at a glance ---- */
.week-hero{
  border-radius:20px; padding:22px 26px; display:flex; align-items:center; justify-content:space-between; gap:18px;
  flex-wrap:wrap; background:
    radial-gradient(140% 180% at 0% 0%, rgba(205,245,235,.55), transparent 60%),
    radial-gradient(120% 160% at 100% 100%, rgba(124,200,255,.4), transparent 60%),
    var(--surface);
  border:1px solid var(--border-soft);
}
.week-hero .wh-num{font-family:var(--font-display); font-weight:800; font-size:clamp(30px,4vw,42px); line-height:1;}
.week-hero .wh-lbl{font-size:13px; color:var(--ink-2); margin-top:6px; font-weight:600;}
.week-tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:12px;}
@media (max-width:900px){.week-tiles{grid-template-columns:1fr 1fr;}}
.week-tile{
  border-radius:16px; padding:17px 18px; border:1px solid var(--border-soft); background:var(--surface);
  position:relative; min-height:96px;
}
.week-tile.is-focus{border-color:transparent; box-shadow:0 0 0 1.5px rgba(124,200,255,.55) inset;}
.week-tile .wt-badge{
  position:absolute; top:12px; right:12px; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  background:var(--grad); color:var(--grad-ink); padding:3px 8px; border-radius:99px;
}
.week-tile .wt-k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:7px;}
.week-tile .wt-icon{width:8px;height:8px;border-radius:50%; flex:none;}
.week-tile .wt-v{margin-top:9px; font-size:14.5px; font-weight:700; line-height:1.35;}
.ring-row{display:flex; gap:14px; align-items:center;}
.ring{position:relative; width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;}
.ring .ring-pct{font-size:10.5px; font-weight:800; font-family:var(--font-display);}
.ring-label{font-size:10.5px; color:var(--ink-3); font-weight:700; margin-top:4px; text-align:center;}
.ring-col{display:flex; flex-direction:column; align-items:center;}
.ring-inner{width:34px; height:34px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center;}

.attn-list{display:flex; flex-direction:column; gap:10px;}
.attn-item{
  display:flex; gap:12px; align-items:flex-start; padding:15px 18px; border-radius:14px;
  border:1px solid var(--border-soft); background:var(--surface-2);
}
.attn-item svg{flex:none; width:18px; height:18px; margin-top:2px; color:var(--warn);}
.attn-item.crit svg{color:var(--crit);}
.attn-item .t{font-size:14px; font-weight:600; line-height:1.45;}
.attn-item .t b{font-weight:800;}

.braindump-wrap{margin-top:50px;}
.braindump-box{
  border-radius:22px; padding:6px; background:var(--surface); border:1px solid var(--border-soft); box-shadow:var(--shadow-md);
  position:relative;
}
.braindump-inner{display:flex; align-items:center; gap:12px; padding:12px 8px 12px 18px;}
.braindump-inner svg{flex:none; width:19px; height:19px; color:var(--ink-3);}
#brainInput{
  flex:1; border:none; outline:none; background:transparent; font-size:16.5px; font-family:var(--font-body);
  color:var(--ink); padding:8px 0;
}
#brainInput::placeholder{color:var(--ink-3);}
.braindump-send{
  border:none; border-radius:14px; padding:11px 18px; background:var(--grad); color:var(--grad-ink); font-weight:800;
  font-size:13.5px; cursor:pointer; flex:none;
}
.braindump-send:disabled{opacity:.35; cursor:default;}
.braindump-hint{text-align:center; margin-top:10px; font-size:12px; color:var(--ink-3);}

.ai-reveal{
  margin-top:14px; border-radius:18px; padding:18px 20px; background:var(--surface-2); border:1px solid var(--border-soft);
  animation:revealIn .4s cubic-bezier(.2,.8,.2,1);
}
@keyframes revealIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;}}
.ai-reveal-head{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink-2);}
.ai-dotgrad{width:8px;height:8px;border-radius:50%; background:var(--grad); flex:none;}
.ai-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.ai-tag{font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:99px; background:var(--surface); border:1px solid var(--border);}

/* ============ INBOX ============ */
.inbox-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.inbox-item{
  display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:14px; cursor:pointer;
  border:1px solid var(--border-soft); background:var(--surface); transition:.15s;
}
.inbox-item:hover{border-color:var(--ink-3); transform:translateX(2px);}
.inbox-item .kind-dot{width:9px;height:9px;border-radius:50%; flex:none;}
.inbox-item .txt{flex:1; font-size:14.5px; font-weight:600;}
.inbox-item .meta{font-size:12px; color:var(--ink-3); flex:none;}

.overlay{
  position:fixed; inset:0; background:rgba(30,24,17,.38); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:flex-end; z-index:60;
}
.overlay.open{display:flex;}
.sheet{
  width:min(480px,92vw); height:100%; background:var(--surface); box-shadow:var(--shadow-lg);
  padding:30px 30px 30px; overflow-y:auto; animation:sheetIn .35s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheetIn{from{transform:translateX(24px); opacity:0;} to{transform:none; opacity:1;}}
.sheet-close{float:right; cursor:pointer; color:var(--ink-3); border:none; background:none; font-size:18px;}
.sheet h3{font-size:15px; color:var(--ink-3); font-weight:700; margin-bottom:14px;}
.sheet .quote{font-size:19px; font-weight:600; line-height:1.5; margin:10px 0 22px; font-family:var(--font-display);}
.understand-box{
  border-radius:16px; padding:18px 20px; background:var(--surface-2); border:1px solid var(--border-soft);
}
.understand-box .ai-reveal-head{margin-bottom:12px;}
.ufact{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border-soft); font-size:13.5px;}
.ufact:first-of-type{border-top:none;}
.ufact .k{color:var(--ink-3); font-weight:600;}
.ufact .v{font-weight:700; text-align:right;}
.sheet-actions{display:flex; gap:8px; margin-top:22px; flex-wrap:wrap;}

/* ============ WORK ============ */
.tabbar{display:flex; gap:6px; background:var(--surface-2); padding:5px; border-radius:13px; width:fit-content; margin-bottom:24px; flex-wrap:wrap;}
.tabbar button{border:none; background:transparent; padding:8px 15px; border-radius:9px; font-size:13px; font-weight:700; color:var(--ink-3); cursor:pointer;}
.tabbar button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.tabbar button{display:inline-flex; align-items:center; gap:6px;}
.tabbar button svg{width:12px; height:12px; opacity:.55;}

.work-list{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:980px){.work-list{grid-template-columns:1fr;}}
.work-card{
  border:1px solid var(--border-soft); background:var(--surface); border-radius:var(--radius); overflow:hidden;
  transition:.15s; display:flex; flex-direction:column;
}
.work-card:hover{box-shadow:var(--shadow-md);}
.wc-head{display:flex; gap:14px; padding:20px 22px 0;}
.wc-tile{
  width:50px; height:50px; border-radius:13px; flex:none; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center; color:var(--grad-ink);
  background:
    radial-gradient(130% 150% at 15% 10%, rgba(205,245,235,.65), transparent 55%),

function bindHome(){
  if(!state.dailyCheckDone){ openDayCheckModal(); }
  const reopen = document.getElementById('reopenDayCheck');
  if(reopen) reopen.addEventListener('click', openDayCheckModal);
  const input = document.getElementById('brainInput');
  const send = document.getElementById('brainSend');
  const submit = ()=>{
    const val = input.value.trim();
    if(!val) return;
    const reveal = document.getElementById('brainReveal');
    reveal.innerHTML = `<div class="ai-reveal"><div class="ai-reveal-head"><span class="ai-dotgrad"></span>Verstehe...</div></div>`;
    input.value=''; send.disabled = true;
    setTimeout(()=>{
      const guess = guessCategorization(val);
      reveal.innerHTML = `
        <div class="ai-reveal">
          <div class="ai-reveal-head"><span class="ai-dotgrad"></span>In die Inbox abgelegt & eingeordnet</div>
          <p style="margin-top:10px; font-size:14.5px; font-weight:600;">„${val}"</p>
          <div class="ai-tags">
            <span class="ai-tag">${guess.type}</span>
            <span class="ai-tag">Marke: ${guess.brand}</span>
            <span class="ai-tag">${guess.potential}</span>
          </div>
        </div>`;
      INBOX.unshift({id:'i'+Date.now(), kind:'idea', brand:guess.brandKey, text:val, ai:{type:guess.type, brand:guess.brand, linked:guess.linked, potential:guess.potential, action:'Weiterdenken'}});
      send.disabled = false;
    }, 900);
  };
  send.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}
function guessCategorization(text){
  const t = text.toLowerCase();
  if(t.includes('remindfuel') || t.includes('reel') || t.includes('minddrop')) return {type:'Content-Idee', brand:'RemindFuel', brandKey:'remindfuel', linked:'Content-Planung', potential:'Sichtbarkeit'};
  if(t.includes('lodora')) return {type:'Idee', brand:'Lodora', brandKey:'lodora', linked:'Lodora', potential:'Unklar'};
  if(t.includes('kunde') || t.includes('projekt') || t.includes('rechnung')) return {type:'Aufgabe', brand:'feelweb', brandKey:'feelweb', linked:'Kundenarbeit', potential:'Umsatzrelevant'};
  return {type:'Gedanke', brand:'feelweb', brandKey:'feelweb', linked:'Noch offen', potential:'Wird geprüft'};
}

function renderChat(id){

function aiReply(userText){
  const t = userText.toLowerCase();
  if(t.includes('kitsch')) return 'Verstanden — ich nehme die weichen Formulierungen raus und mache den Ton nüchterner. Einen Moment.';
  if(t.includes('tiefer')) return 'Guter Impuls. Was wäre, wenn wir nicht nur sagen *dass* Stillstand okay ist, sondern zeigen, *woran man ihn im Alltag erkennt*? Das macht es greifbarer.';
  if(t.includes('konkret')) return 'Ich ersetze den Einstieg durch ein konkretes Bild statt der allgemeinen Aussage — das passt besser zu deinem Stil.';
  if(t.includes('perspektive')) return 'Hier drei: 1) Stillstand als Erholung fürs Nervensystem. 2) Stillstand als Zeichen, dass du gerade neu kalibrierst. 3) Stillstand, den nur du siehst — von außen wirkt es oft wie Fortschritt.';
  return 'Ich denk das weiter und melde mich mit einer überarbeiteten Version.';
}
function bindWorkspace(id){
  document.getElementById('wsBack').addEventListener('click', ()=>{ state.activeWorkspace=null; render(); });

  const send = ()=>{
    const inp = document.getElementById('wsChatInput');
    const val = inp.value.trim(); if(!val) return;
    CHAT_LOG[id].push({who:'user', text:val}); inp.value='';
    chatBody.innerHTML = renderChat(id) + `<div class="msg ai"><span class="typing"><span></span><span></span><span></span></span></div>`;
    chatBody.scrollTop = chatBody.scrollHeight;
    setTimeout(()=>{ CHAT_LOG[id].push({who:'ai', text:aiReply(val)}); chatBody.innerHTML = renderChat(id); chatBody.scrollTop = chatBody.scrollHeight; }, 1000);
  };
  document.getElementById('wsChatSend').addEventListener('click', send);
  document.getElementById('wsChatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  document.querySelectorAll('[data-quick]').forEach(el=>el.addEventListener('click', ()=>{
    const map = {reel:'Ich forme daraus ein Reel-Skript mit Hook, Mitte und Call-to-Action.', carousel:'Ich baue daraus ein 5-Slide-Carousel im RemindFuel-Stil.', caption:'Ich schreibe eine passende Caption dazu.', think:'Lass uns den Gedanken gemeinsam weiterspinnen — was fehlt deiner Meinung nach noch?'};

  }));

      const parentRect = doc.parentElement.getBoundingClientRect();
      pop.style.display='flex';
      pop.style.top = (r.top - parentRect.top - 44) + 'px';
      pop.style.left = Math.max(0,(r.left - parentRect.left)) + 'px';
    } else { pop.style.display='none'; }
  });
  document.querySelectorAll('[data-sel]').forEach(el=>el.addEventListener('click', ()=>{
    pop.style.display='none';
    const map = {rewrite:'Ich habe die markierte Stelle überarbeitet — schau sie dir gleich im Dokument an.', deeper:'Ich vertiefe genau diesen Gedanken.', concrete:'Ich mache diese Stelle konkreter.'};
    CHAT_LOG[id].push({who:'ai', text: map[el.dataset.sel]});
    document.getElementById('wsChat').innerHTML = renderChat(id);
  }));
}

/* Ein Rückblick soll erst Abstand zum Zeitraum haben, bevor er ehrlich
   sein kann — daher schaltet er erst in der letzten Woche frei
   (Jahresrückblick: im Dezember, vor Weihnachten). */
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function fmtDate(d){ return d.toLocaleDateString('de-DE',{day:'numeric', month:'long'}); }
function reviewAvailability(){
  const now = new Date();
  const y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const dim = daysInMonth(y,m);
  const monthUnlockDate = new Date(y,m,dim-6);
  const monthUnlocked = d >= dim-6;

  const qEndMonths=[2,5,8,11];
  const qEndMonth = qEndMonths[Math.floor(m/3)];
  const qDim = daysInMonth(y,qEndMonth);
  const quarterUnlockDate = new Date(y,qEndMonth,qDim-6);
  const quarterUnlocked = m===qEndMonth && d>=qDim-6;

  const yearUnlockDate = new Date(y,11,1); // 1. Dezember — "vor Weihnachten"
  const yearUnlocked = m===11;

  return {
    month:{ unlocked:monthUnlocked, date:monthUnlockDate },
    quarter:{ unlocked:quarterUnlocked, date:quarterUnlockDate },
    year:{ unlocked:yearUnlocked, date:yearUnlockDate },
  };
}
